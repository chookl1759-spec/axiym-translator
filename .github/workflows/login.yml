name: login
on:
  workflow_dispatch:
    inputs:
      code:
        description: "1단계는 비워 두세요. 2단계에 텔레그램 로그인 코드 입력"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: login
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mask code
        run: |
          CODE=$(jq -r '.inputs.code // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$CODE" ]; then echo "::add-mask::$CODE"; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: login_tmp
          key: login-${{ github.run_id }}
          restore-keys: login-
      - run: python login.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          TG_2FA: ${{ secrets.TG_2FA }}
          LOGIN_CODE: ${{ inputs.code }}
      - uses: actions/cache/save@v4
        if: success() && inputs.code == ''
        with:
          path: login_tmp
          key: login-${{ github.run_id }}
