name: repair
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: translate
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python repair.py
        env:
          HISTORY_TOKEN: ${{ secrets.HISTORY_TOKEN }}
          HISTORY_REPO: ${{ vars.HISTORY_REPO }}
